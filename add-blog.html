<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Blog - Codomax Blog</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="header">

        <nav class="navbar">

            <div class="logo">

                <i class="fa-solid fa-blog"></i>

                <h2>Codomax Blog</h2>

            </div>


            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="add-blog.html" class="active">
                        Add Blog
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="contact.html">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- ================= ADD BLOG FORM ================= -->

    <section class="form-section">

        <div class="form-container">

            <h1>Add New Blog</h1>

            <p>Share your thoughts with the world.</p>


            <form id="blogForm">


                <!-- Blog Title -->

                <label for="title">
                    Blog Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter Blog Title">


                <!-- Author -->

                <label for="author">
                    Author Name
                </label>

                <input
                    type="text"
                    id="author"
                    placeholder="Enter Author Name">


                <!-- Category -->

                <label for="category">
                    Category
                </label>

                <input
                    type="text"
                    id="category"
                    placeholder="Enter Category">


                <!-- Blog Image -->

                <label for="image">
                    Blog Image
                </label>

                <input
                    type="file"
                    id="image"
                    accept="image/*">


                <!-- Image Preview -->

                <img
                    id="previewImage"
                    src=""
                    alt="Blog Image Preview"
                    style="
                        display:none;
                        width:100%;
                        height:250px;
                        object-fit:cover;
                        border-radius:10px;
                        margin-top:15px;
                        margin-bottom:20px;
                    ">


                <!-- Blog Content -->

                <label for="content">
                    Blog Content
                </label>

                <textarea
                    id="content"
                    rows="8"
                    placeholder="Write your blog here..."></textarea>


                <!-- Submit -->

                <button
                    id="submitBtn"
                    class="btn"
                    type="submit">

                    Publish Blog

                </button>


            </form>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <p>
            © 2026 Codomax Blog. All Rights Reserved.
        </p>

    </footer>


    <!-- JavaScript -->

    <script src="js/script.js"></script>

</body>

</html>
